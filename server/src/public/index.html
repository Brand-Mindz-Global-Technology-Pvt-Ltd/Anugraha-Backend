<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin panel - Backend API</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #020617;
        padding: 2rem 3rem;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      p {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Backend API Running</h1>
      <p>Status: OK</p>
      <p>Environment: Production</p>
    </div>
  </body>
</html>
